# Matched by the analyzer but left recompiled because its list of runtime HLE
# names is stale.  Recompiled, these drive DMA channel 6 (OTC) through
# libgpu's queue and spin in its set_alarm timeout (0x8008AF74) -- the first
# in-game frame never finished.
[[hle_functions]]
name = "libgpu_ClearOTag"
address = "0x80088D88"

[[hle_functions]]
name = "libgpu_ClearOTagR"
address = "0x80088E50"

[[hle_functions]]
name = "libgpu_StoreImage"
address = "0x80088C70"

[[hle_functions]]
name = "libcd_CdInit"
address = "0x800981B8"

[[hle_functions]]
name = "libcd_CdSync"
address = "0x800983FC"

[[hle_functions]]
name = "libcd_CdReady"
address = "0x8009841C"

[[hle_functions]]
name = "libcd_CdReadyCallback"
address = "0x80098450"

[[hle_functions]]
name = "libcd_CdGetSector"
address = "0x80098840"

# CdControlB(com, param, result) -- CdControl then block until it completes.
# Recompiled it goes through libcd's CD_cw/CD_sync, which wait on state that
# libcd's own CD interrupt handler sets (the runtime answers the drive
# itself), so it sat in VSync timeouts after every movie.  The runtime's
# CdControl already completes synchronously.
[[hle_functions]]
name = "libcd_CdControl"
address = "0x800986D4"

# libpad.  The front end calls PadInitMtap(0x800ECA78, 0x800ECA9A) then
# PadStartCom (0x800703EC), and its reader (0x80070A1C) parses those raw
# buffers itself -- byte 1 == 0x80 means multitap, anything else a single
# pad -- so PadInitDirect's single-pad fill is a valid answer to
# PadInitMtap.  The reader's resync path is PadStopCom then PadStartCom
# (0x80070C28).
[[hle_functions]]
name = "libetc_PadInitDirect"
address = "0x8009EE08"

[[hle_functions]]
name = "libetc_PadStartCom"
address = "0x8009CE38"

[[hle_functions]]
name = "libetc_PadStopCom"
address = "0x8009CE58"

# The rest of libpad the game calls.  Each one fetches libpad's internal
# port table through *0x800FF490, which only the real PadInitMtap fills in;
# with init HLE'd they called through null every in-game frame.
# PadGetState(port), from the pad handler (0x80070708) and gameplay.
[[hle_functions]]
name = "libetc_PadGetState"
address = "0x8009CEC4"

# PadSetAct(port, buf, 2) -- vibration buffer (0x80070780).
[[hle_functions]]
name = "libpad_PadSetAct"
address = "0x8009D278"

# PadSetActAlign(port, table) -- DualShock motor negotiation (0x800707A4).
[[hle_functions]]
name = "libpad_PadSetActAlign"
address = "0x8009D1F8"
